name: Feature request
description: Suggest a new check or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Which failure mode should ResilienceCheck catch?
      description: Describe the real-world problem, ideally with an incident or bug it caused.
    validations:
      required: true
  - type: textarea
    id: detection
    attributes:
      label: How could it be detected reliably?
      description: What would the scenario provoke, and what would be measured? What could cause false positives?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you use today
